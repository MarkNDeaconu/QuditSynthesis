name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      # pip install uses the maturin build backend: builds quditsynthesis._rust
      # (release) and installs the package with test dependencies.
      - name: Install package and dev tools
        run: pip install ".[dev]"

      - name: SymPy exact-oracle workflow (both backends)
        run: pytest tests/sympy_oracle_tests.py -q

      - name: numpy oracle workflow (both backends)
        run: python tests/numpy_oracle_tests.py

[project]
name = "quditsynthesis"
version = "0.1.0"
description = "Quantum circuit synthesis utils for qubits and qudits"
authors = [
  { name = "Mark Deaconu", email = "mark.deaconu@proton.me" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
  "numpy >=1.25",
  "tabulate >=0.9.0",
  "matplotlib",
  "networkx"
]

[project.optional-dependencies]
dev = [
  "maturin >=1.0",
  "pytest"
]

[project.urls]
Homepage = "https://github.com/MarkNDeaconu/QuditSynthesis"
Repository = "https://github.com/MarkNDeaconu/QuditSynthesis"
Issues = "https://github.com/MarkNDeaconu/QuditSynthesis/issues"

[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "quditsynthesis._rust"
manifest-path = "rust/Cargo.toml"
